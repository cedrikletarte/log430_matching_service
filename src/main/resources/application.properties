spring.application.name=Matching_Service
server.port=8080

# ========================================
# Actuator & Observability Configuration
# ========================================

# Expose tous les endpoints Actuator (pour dev/test)
management.endpoints.web.exposure.include=*

# Port dédié pour les métriques (optionnel, sinon utilise le même port)
management.server.port=8080

# Activer les métriques détaillées
management.metrics.enable.all=true
management.prometheus.metrics.export.enabled=true

# Activer les histogrammes pour les percentiles (p95, p99)
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.percentiles.http.server.requests=0.5,0.95,0.99
management.metrics.distribution.slo.http.server.requests=10ms,50ms,100ms,200ms,500ms,1s,2s

# Health check détaillé
management.endpoint.health.show-details=always
management.health.defaults.enabled=true

# Tags custom pour identifier le service dans Prometheus
management.metrics.tags.application=${spring.application.name}
management.metrics.tags.environment=local

# ========================================
# Kafka Configuration (KRaft Mode)
# ========================================

# Kafka Bootstrap Servers
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:kafka:9092}

# Consumer Configuration
spring.kafka.consumer.group-id=${SPRING_KAFKA_CONSUMER_GROUP_ID:matching-service-group}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*

# Producer Configuration
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.retries=3

# Type Mapping for Kafka Messages
spring.kafka.consumer.properties.spring.json.type.mapping=OrderAcceptedEvent:com.brokerx.matching_service.infrastructure.kafka.dto.OrderAcceptedEvent
spring.kafka.producer.properties.spring.json.type.mapping=OrderMatchedEvent:com.brokerx.matching_service.infrastructure.kafka.dto.OrderMatchedEvent

# Topic Names
kafka.topic.order-accepted=${KAFKA_TOPIC_ORDER_ACCEPTED:order.accepted}
kafka.topic.order-matched=${KAFKA_TOPIC_ORDER_MATCHED:order.matched}

# Kafka Consumer Concurrency
spring.kafka.listener.concurrency=3
